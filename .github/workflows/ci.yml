name: InsightFlow quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insightflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests • ${{ matrix.os }} • Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: InsightFlow_GitHub_Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: InsightFlow_GitHub_Release/requirements*.txt

      - name: Install application and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q app.py insightflow_agent.py launch_insightflow.py self_test.py scripts tests

      - name: Run offline self-test
        run: python self_test.py

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Check dependency consistency
        run: python -m pip check

      - name: Scan repository files for common secret patterns
        run: python scripts/check_secrets.py

  streamlit-smoke:
    name: Streamlit HTTP smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: InsightFlow_GitHub_Release/requirements.txt

      - name: Install application dependencies
        run: python -m pip install -r InsightFlow_GitHub_Release/requirements.txt

      - name: Start Streamlit and verify health endpoint
        run: python InsightFlow_GitHub_Release/scripts/streamlit_smoke.py
